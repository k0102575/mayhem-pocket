name: Windows Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Check version tag
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version differ' }
      - run: npm test
      - run: npm run build
      - run: npm run package:windows
      - run: node scripts/verify-package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/*.zip
            release/*.sha256
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          body: |
            Windows x64 실행용 ZIP을 다운로드하고 압축 해제하세요 (Source code ZIP과 다릅니다).
            .env.example을 .env로 복사해 본인 ARAMGG_API_KEY를 설정하고 실행.cmd를 더블클릭하세요.
            종료는 화면의 종료 버튼 또는 종료.cmd를 사용하세요.
            업데이트 전 종료하고 runtime/, app/, dist/, scripts/와 실행·종료 스크립트를 교체하세요. .env와 cache/는 유지하세요.
            Windows 10 실사용 및 메모리 측정은 별도 확인이 필요한 사전 릴리스입니다.
          files: |
            release/*.zip
            release/*.sha256
