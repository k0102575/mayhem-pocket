name: Windows Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Check version tag
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version differ' }
      - name: Check release notes
        shell: pwsh
        run: |
          if (!(Test-Path "docs/releases/$env:GITHUB_REF_NAME.md")) { throw "Release notes missing" }
      - run: npm test
      - run: npm run build
      - run: npm run package:windows
      - run: node scripts/verify-package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/*.zip
            release/*.sha256
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: false
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            release/*.zip
            release/*.sha256
